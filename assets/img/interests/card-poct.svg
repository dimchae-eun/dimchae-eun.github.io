<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="A handheld reader with a disposable test strip and a drop of blood, showing a result">
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf0ff"/><stop offset="1" stop-color="#c9d8ff"/></linearGradient></defs>
  <rect width="640" height="480" fill="url(#bg2)"/>
  <circle cx="110" cy="400" r="140" fill="#ffffff" opacity=".35"/>
  <!-- reader -->
  <rect x="215" y="70" width="210" height="340" rx="34" fill="#ffffff" stroke="#9db5f5" stroke-width="4"/>
  <rect x="245" y="105" width="150" height="120" rx="14" fill="#1e40af"/>
  <path d="M265,195 L300,195 L315,150 L332,205 L345,178 L375,178" fill="none" stroke="#93b2ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="263" y="122" width="58" height="12" rx="6" fill="#6b93ff"/>
  <circle cx="320" cy="290" r="30" fill="#eaf0ff" stroke="#2f5fe0" stroke-width="4"/>
  <path d="M305,290 l11,11 l20,-22" fill="none" stroke="#2f5fe0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- strip -->
  <rect x="290" y="395" width="60" height="70" rx="6" fill="#ffffff" stroke="#9db5f5" stroke-width="3"/>
  <rect x="304" y="420" width="32" height="20" rx="4" fill="#c9d8ff"/>
  <!-- drop -->
  <path d="M470,300 C470,300 440,340 440,362 a30,30 0 0 0 60,0 C500,340 470,300 470,300 Z" fill="#e2566b"/>
  <ellipse cx="460" cy="360" rx="7" ry="11" fill="#ffffff" opacity=".45"/>
  <!-- clock -->
  <circle cx="140" cy="140" r="44" fill="#ffffff" stroke="#2f5fe0" stroke-width="5"/>
  <path d="M140,112 L140,140 L160,150" fill="none" stroke="#2f5fe0" stroke-width="5" stroke-linecap="round"/>
</svg>
