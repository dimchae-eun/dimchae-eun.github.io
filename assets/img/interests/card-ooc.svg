<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="A microfluidic organ-on-chip with tissue between channels and integrated electrodes reading a live signal">
  <defs><linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf0ff"/><stop offset="1" stop-color="#c9d8ff"/></linearGradient></defs>
  <rect width="640" height="480" fill="url(#bg3)"/>
  <circle cx="560" cy="420" r="150" fill="#ffffff" opacity=".35"/>
  <!-- chip in perspective -->
  <path d="M80,250 L320,140 L580,230 L340,350 Z" fill="#ffffff" stroke="#9db5f5" stroke-width="4"/>
  <path d="M80,250 L80,280 L340,380 L340,350 Z" fill="#dfe7fb"/>
  <path d="M340,350 L340,380 L580,260 L580,230 Z" fill="#cfdcfa"/>
  <!-- channel -->
  <path d="M150,248 L330,165 L510,228 L332,312 Z" fill="#eaf0ff" stroke="#2f5fe0" stroke-width="3"/>
  <!-- cells -->
  <g fill="#f4b6a6" stroke="#d98a76" stroke-width="2">
    <circle cx="250" cy="236" r="13"/><circle cx="280" cy="222" r="13"/><circle cx="310" cy="208" r="13"/><circle cx="276" cy="250" r="13"/><circle cx="306" cy="236" r="13"/><circle cx="336" cy="222" r="13"/><circle cx="302" cy="264" r="13"/><circle cx="332" cy="250" r="13"/><circle cx="362" cy="236" r="13"/>
  </g>
  <!-- electrodes -->
  <g fill="#1e40af"><path d="M420,250 l26,-12 l8,4 l-26,12 z"/><path d="M436,258 l26,-12 l8,4 l-26,12 z"/><path d="M452,266 l26,-12 l8,4 l-26,12 z"/></g>
  <!-- tube ports -->
  <circle cx="190" cy="232" r="12" fill="#2f5fe0"/><circle cx="480" cy="232" r="12" fill="#2f5fe0" opacity=".6"/>
  <!-- live signal -->
  <rect x="380" y="55" width="200" height="110" rx="18" fill="#ffffff" opacity=".95"/>
  <path d="M400,130 L440,130 L455,92 L472,140 L485,118 L560,118" fill="none" stroke="#2f5fe0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M470,212 C480,190 470,180 470,170" fill="none" stroke="#2f5fe0" stroke-width="4" stroke-dasharray="6 6" stroke-linecap="round"/>
</svg>
