<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="Inter, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t3 d3">
  <title id="t3">Organ-on-chip with an integrated biochemical sensor</title>
  <desc id="d3">A microfluidic chip with a tissue layer on a porous membrane between two channels. Medium flows past the tissue to an electrochemical sensor at the outlet, which produces a continuous readout of tissue responses over time.</desc>
  <rect width="760" height="290" fill="#ffffff"/>
  <defs><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5fe0"/></marker></defs>
  <!-- chip body -->
  <rect x="30" y="50" width="470" height="190" rx="18" fill="#f1f3f6" stroke="#d1d5db" stroke-width="1.5"/>
  <!-- upper channel -->
  <rect x="55" y="78" width="420" height="46" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <!-- tissue on membrane -->
  <line x1="55" y1="148" x2="475" y2="148" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 4"/>
  <g fill="#f4b6a6" stroke="#d98a76" stroke-width="1">
    <circle cx="95" cy="137" r="10"/><circle cx="125" cy="137" r="10"/><circle cx="155" cy="137" r="10"/><circle cx="185" cy="137" r="10"/><circle cx="215" cy="137" r="10"/><circle cx="245" cy="137" r="10"/><circle cx="275" cy="137" r="10"/><circle cx="305" cy="137" r="10"/><circle cx="335" cy="137" r="10"/>
  </g>
  <!-- lower channel -->
  <rect x="55" y="162" width="420" height="46" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <!-- flow arrows -->
  <g stroke="#2f5fe0" stroke-width="2" marker-end="url(#f)">
    <line x1="75" y1="101" x2="125" y2="101"/><line x1="215" y1="101" x2="265" y2="101"/>
    <line x1="75" y1="185" x2="125" y2="185"/><line x1="215" y1="185" x2="265" y2="185"/>
  </g>
  <!-- electrodes -->
  <g fill="#2f5fe0"><rect x="392" y="168" width="10" height="34" rx="2"/><rect x="412" y="168" width="10" height="34" rx="2"/><rect x="432" y="168" width="10" height="34" rx="2"/></g>
  <g font-size="12" fill="#4b5563">
    <text x="55" y="40" font-weight="700" fill="#6b7280" letter-spacing="1">ORGAN-ON-CHIP</text>
    <text x="300" y="106">medium flow</text>
    <text x="355" y="142">tissue / organoid layer</text>
    <text x="370" y="226" fill="#1e40af" font-weight="600">integrated sensor</text>
  </g>
  <!-- connector -->
  <path d="M447,185 C520,185 520,145 560,145" fill="none" stroke="#2f5fe0" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#f)"/>
  <!-- readout -->
  <rect x="565" y="70" width="170" height="150" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="580" y="95" font-size="12" font-weight="700" fill="#6b7280" letter-spacing="1">IN SITU READOUT</text>
  <line x1="582" y1="195" x2="720" y2="195" stroke="#d1d5db"/>
  <path d="M582,170 C605,168 620,172 640,166 S665,130 680,135 S705,150 720,148" fill="none" stroke="#2f5fe0" stroke-width="3" stroke-linecap="round"/>
  <line x1="650" y1="110" x2="650" y2="195" stroke="#9ca3af" stroke-dasharray="3 3"/>
  <text x="654" y="118" font-size="11" fill="#6b7280">drug added</text>
  <text x="650" y="212" font-size="11" fill="#6b7280" text-anchor="middle">time</text>
</svg>
