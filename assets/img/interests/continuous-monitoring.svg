<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t1 d1">
  <title id="t1">Continuous monitoring versus single laboratory measurements</title>
  <desc id="d1">A continuous biochemical trace over time, sparse clinic measurements that sample only a few points, and an uncorrected sensor signal that gradually drifts away from the true trace.</desc>
  <rect width="760" height="300" fill="#ffffff"/>
  <!-- legend -->
  <g font-size="13" fill="#4b5563">
    <line x1="70" y1="30" x2="100" y2="30" stroke="#2f5fe0" stroke-width="3" stroke-linecap="round"/>
    <text x="108" y="34">Continuous sensor (true trend)</text>
    <circle cx="330" cy="30" r="6" fill="#1a1d23"/>
    <text x="344" y="34">Single clinic test</text>
    <line x1="490" y1="30" x2="520" y2="30" stroke="#9ca3af" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="528" y="34">Uncorrected drift</text>
  </g>
  <!-- axes -->
  <line x1="60" y1="250" x2="725" y2="250" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="60" y1="60" x2="60" y2="250" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="725" y="276" font-size="12" fill="#6b7280" text-anchor="end">Time (hours → days)</text>
  <text x="44" y="155" font-size="12" fill="#6b7280" text-anchor="middle" transform="rotate(-90 44 155)">Biomarker level</text>
  <!-- drift -->
  <path d="M60,175 C120,153 160,187 220,168 S320,107 380,122 S480,170 540,135 S640,68 720,80" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-dasharray="6 5"/>
  <!-- true trace -->
  <path d="M60,175 C120,155 160,195 220,180 S320,125 380,145 S480,205 540,175 S640,115 720,135" fill="none" stroke="#2f5fe0" stroke-width="3.5" stroke-linecap="round"/>
  <!-- clinic snapshots -->
  <g fill="#1a1d23">
    <circle cx="60" cy="175" r="6.5"/>
    <circle cx="380" cy="145" r="6.5"/>
    <circle cx="720" cy="135" r="6.5"/>
  </g>
  <!-- annotation -->
  <path d="M640,96 L640,118" stroke="#2f5fe0" stroke-width="1.5" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5fe0"/></marker></defs>
  <text x="600" y="214" font-size="12" fill="#1e40af" text-anchor="middle">Can the signal stay accurate</text>
  <text x="600" y="230" font-size="12" fill="#1e40af" text-anchor="middle">without repeated recalibration?</text>
</svg>
