<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="Inter, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t2 d2">
  <title id="t2">Central laboratory testing compared with point-of-care testing</title>
  <desc id="d2">In central laboratory testing, a sample is collected, transported, and analyzed before the result returns, taking hours to days. At the point of care, a sample is measured directly on a disposable device and the result is available in minutes.</desc>
  <rect width="760" height="270" fill="#ffffff"/>
  <defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
  <marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5fe0"/></marker></defs>
  <!-- row 1 -->
  <text x="30" y="40" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1">CENTRAL LABORATORY</text>
  <g font-size="13" fill="#4b5563" text-anchor="middle">
    <rect x="30" y="56" width="120" height="48" rx="9" fill="#f1f3f6" stroke="#e5e7eb"/><text x="90" y="85">Sample</text>
    <rect x="200" y="56" width="120" height="48" rx="9" fill="#f1f3f6" stroke="#e5e7eb"/><text x="260" y="85">Transport</text>
    <rect x="370" y="56" width="120" height="48" rx="9" fill="#f1f3f6" stroke="#e5e7eb"/><text x="430" y="85">Analyzer</text>
    <rect x="540" y="56" width="120" height="48" rx="9" fill="#f1f3f6" stroke="#e5e7eb"/><text x="600" y="85">Result</text>
  </g>
  <g stroke="#9ca3af" stroke-width="2" marker-end="url(#b)">
    <line x1="152" y1="80" x2="196" y2="80"/><line x1="322" y1="80" x2="366" y2="80"/><line x1="492" y1="80" x2="536" y2="80"/>
  </g>
  <text x="680" y="85" font-size="13" fill="#6b7280">hours–days</text>
  <!-- row 2 -->
  <text x="30" y="160" font-size="13" font-weight="700" fill="#2f5fe0" letter-spacing="1">POINT OF CARE</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="176" width="120" height="48" rx="9" fill="#eaf0ff" stroke="#2f5fe0"/><text x="90" y="205" fill="#1e40af">Sample</text>
    <rect x="285" y="176" width="120" height="48" rx="9" fill="#eaf0ff" stroke="#2f5fe0"/><text x="345" y="205" fill="#1e40af">Device</text>
    <rect x="540" y="176" width="120" height="48" rx="9" fill="#2f5fe0"/><text x="600" y="205" fill="#ffffff" font-weight="600">Result</text>
  </g>
  <g stroke="#2f5fe0" stroke-width="2.2" marker-end="url(#c)">
    <line x1="152" y1="200" x2="281" y2="200"/><line x1="407" y1="200" x2="536" y2="200"/>
  </g>
  <text x="680" y="205" font-size="13" font-weight="600" fill="#2f5fe0">minutes</text>
  <text x="345" y="250" font-size="12" fill="#6b7280" text-anchor="middle">bedside · clinic · home · resource-limited settings</text>
</svg>
