<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" role="img" aria-labelledby="title desc">
  <title id="title">Laser-induced graphene fabrication</title>
  <desc id="desc">A carbon dioxide laser patterning porous graphene on a polyimide sheet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#e9f2ff"/></linearGradient>
    <linearGradient id="pi" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5a64b"/><stop offset=".55" stop-color="#c96525"/><stop offset="1" stop-color="#8d3e1d"/></linearGradient>
    <linearGradient id="laser" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff5a4b" stop-opacity="0"/><stop offset=".65" stop-color="#ff4d30" stop-opacity=".65"/><stop offset="1" stop-color="#ffb55b"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4c5968"/><stop offset=".25" stop-color="#edf3f8"/><stop offset=".55" stop-color="#7a8794"/><stop offset=".82" stop-color="#f7fafc"/><stop offset="1" stop-color="#3e4a56"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#526b8f" flood-opacity=".25"/></filter>
    <pattern id="pores" width="28" height="24" patternUnits="userSpaceOnUse">
      <rect width="28" height="24" fill="#161b21"/><circle cx="7" cy="7" r="5" fill="#040608"/><circle cx="22" cy="16" r="7" fill="#06090c"/><circle cx="13" cy="22" r="3" fill="#343b43"/>
    </pattern>
  </defs>
  <rect width="560" height="350" fill="url(#bg)"/>
  <g filter="url(#shadow)" transform="translate(59 225) skewY(-8)">
    <path d="M0 0h420l28 83H27Z" fill="url(#pi)"/>
    <path d="M212 0h208l28 83H233Z" fill="url(#pores)"/>
    <path d="M212 0v83" stroke="#ffca74" stroke-width="3" opacity=".8"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M208 25h145l-17 76H226Z" fill="url(#metal)"/>
    <path d="M226 101h110l-24 29h-62Z" fill="#495563"/>
    <path d="M250 130h62l-10 23h-42Z" fill="url(#metal)"/>
    <ellipse cx="281" cy="154" rx="22" ry="7" fill="#242b34"/>
  </g>
  <path d="m281 155-49 99h98Z" fill="url(#laser)" opacity=".88"/>
  <path d="M281 155v101" stroke="#ff7046" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="281" cy="257" r="9" fill="#ffdc91" opacity=".9"/>
  <g transform="translate(390 42)" filter="url(#shadow)">
    <circle cx="70" cy="70" r="65" fill="#fff" stroke="#b8cef0" stroke-width="4"/>
    <circle cx="70" cy="70" r="56" fill="url(#pores)"/>
    <g fill="none" stroke="#606b76" stroke-width="2" opacity=".7"><circle cx="43" cy="48" r="16"/><circle cx="86" cy="40" r="12"/><circle cx="91" cy="83" r="19"/><circle cx="46" cy="94" r="13"/></g>
  </g>
  <path d="M351 206c37-11 56-28 70-52" fill="none" stroke="#5f89ce" stroke-width="3" stroke-dasharray="7 8"/>
</svg>
