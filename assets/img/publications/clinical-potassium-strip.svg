<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Clinical evaluation of disposable potassium test strip scheme</title><desc id="desc">A finger-prick blood sample is applied to a disposable potassium test strip and read with a handheld potentiometric device.</desc><defs><linearGradient id="b" x1="0" x2="1"><stop stop-color="#fff9f3"/><stop offset="1" stop-color="#f4fbfb"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#5d3821" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#bf743d"/></marker></defs><rect width="960" height="600" rx="30" fill="url(#b)"/><text x="60" y="78" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#5e3820">Clinical Evaluation of a Disposable K⁺ Test Strip</text><text x="60" y="114" font-family="Arial, sans-serif" font-size="18" fill="#876752">Maintenance hemodialysis: rapid point-of-care potassium monitoring</text><g filter="url(#s)"><rect x="60" y="175" width="205" height="230" rx="24" fill="#fff" stroke="#f1c79d" stroke-width="2"/><path d="M131 233 c35 -64 76 -47 62 1 c-7 24 -26 37 -35 72" fill="none" stroke="#e1a173" stroke-width="19" stroke-linecap="round"/><circle cx="178" cy="275" r="8" fill="#c34747"/><text x="162" y="353" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#653c24">Finger-prick</text><text x="162" y="378" text-anchor="middle" font-family="Arial" font-size="16" fill="#876752">whole-blood sample</text></g><path d="M277 289 H371" stroke="#bf743d" stroke-width="6" marker-end="url(#a)"/><g filter="url(#s)"><rect x="384" y="175" width="216" height="230" rx="24" fill="#fff" stroke="#f1c79d" stroke-width="2"/><rect x="420" y="249" width="147" height="60" rx="10" fill="#e2d8c8"/><rect x="437" y="263" width="62" height="32" rx="5" fill="#393c43"/><rect x="509" y="263" width="42" height="32" rx="5" fill="#d99c60"/><text x="492" y="353" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#653c24">Disposable strip</text><text x="492" y="378" text-anchor="middle" font-family="Arial" font-size="16" fill="#876752">potentiometric sensing</text></g><path d="M612 289 H706" stroke="#bf743d" stroke-width="6" marker-end="url(#a)"/><g filter="url(#s)"><rect x="719" y="175" width="180" height="230" rx="24" fill="#fff" stroke="#9ed9d0" stroke-width="2"/><rect x="760" y="222" width="98" height="101" rx="13" fill="#22645f"/><rect x="777" y="240" width="64" height="40" rx="6" fill="#c8f3e9"/><text x="809" y="268" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1d6860">4.2</text><circle cx="785" cy="301" r="7" fill="#e5ba64"/><circle cx="810" cy="301" r="7" fill="#e5ba64"/><circle cx="835" cy="301" r="7" fill="#e5ba64"/><text x="809" y="353" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#245e59">Handheld reader</text><text x="809" y="378" text-anchor="middle" font-family="Arial" font-size="16" fill="#568681">mEq/L result</text></g><g filter="url(#s)"><rect x="152" y="455" width="657" height="75" rx="20" fill="#fff" stroke="#e7ded5" stroke-width="2"/><text x="480" y="486" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#5e3820">Clinical agreement assessed against laboratory reference measurement</text><text x="480" y="513" text-anchor="middle" font-family="Arial" font-size="16" fill="#876752">six capillary and six venous strip measurements per patient</text></g></svg>