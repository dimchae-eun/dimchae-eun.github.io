<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Calibration-free potassium sensing scheme</title><desc id="desc">Potassium initiates a pyruvate kinase and pyruvate oxidase enzyme cascade on a laser-induced graphene electrode, producing an amperometric current.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#eef8f7"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#163a51" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#276fa3"/></marker></defs><rect width="960" height="600" rx="30" fill="url(#bg)"/><text x="60" y="78" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17364d">Calibration-Free Potassium Quantification</text><text x="60" y="114" font-family="Arial, sans-serif" font-size="18" fill="#537084">Stoichiometric enzyme cascade on laser-induced graphene</text><g filter="url(#s)"><rect x="60" y="164" width="190" height="138" rx="20" fill="#fff" stroke="#bad9ef" stroke-width="2"/><circle cx="111" cy="225" r="29" fill="#e9f2ff"/><text x="111" y="233" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#286090">K⁺</text><text x="159" y="213" font-family="Arial" font-size="17" font-weight="700" fill="#17364d">Potassium</text><text x="159" y="238" font-family="Arial" font-size="15" fill="#537084">target ion</text></g><path d="M258 233 H345" stroke="#276fa3" stroke-width="6" marker-end="url(#a)"/><g filter="url(#s)"><rect x="355" y="164" width="180" height="138" rx="20" fill="#fff" stroke="#9bd8be" stroke-width="2"/><text x="445" y="218" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#24724d">PK</text><text x="445" y="248" text-anchor="middle" font-family="Arial" font-size="15" fill="#537084">K⁺-dependent step</text></g><path d="M543 233 H630" stroke="#276fa3" stroke-width="6" marker-end="url(#a)"/><g filter="url(#s)"><rect x="640" y="164" width="180" height="138" rx="20" fill="#fff" stroke="#f0be78" stroke-width="2"/><text x="730" y="218" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#b16d11">POx</text><text x="730" y="248" text-anchor="middle" font-family="Arial" font-size="15" fill="#537084">signal generation</text></g><path d="M730 313 V372" stroke="#276fa3" stroke-width="6" marker-end="url(#a)"/><g filter="url(#s)"><rect x="205" y="391" width="550" height="128" rx="22" fill="#193848"/><path d="M245 481 C300 426 355 520 410 454 S520 424 575 470 S670 510 718 439" fill="none" stroke="#6be2c2" stroke-width="6"/><text x="480" y="426" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#fff">Laser-Induced Graphene Electrode</text><text x="480" y="501" text-anchor="middle" font-family="Arial" font-size="18" fill="#b8d9d8">amperometric current ∝ K⁺ concentration</text></g><text x="60" y="562" font-family="Arial" font-size="16" fill="#537084">Mediator-assisted electrochemical readout eliminates conventional calibration.</text></svg>