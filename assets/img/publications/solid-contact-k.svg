<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Solid-contact potassium biosensor scheme</title><desc id="desc">A layered potassium ion-selective electrode using carbon-coated manganese dioxide nanosheets as the solid-contact transducer.</desc><defs><linearGradient id="b" x1="0" x2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#f7f4ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2c2854" flood-opacity=".12"/></filter></defs><rect width="960" height="600" rx="30" fill="url(#b)"/><text x="60" y="78" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#30295d">Solid-Contact Potassium-Ion Biosensor</text><text x="60" y="114" font-family="Arial, sans-serif" font-size="18" fill="#6c6790">Supercapacitive carbon-coated δ-MnO₂ nanosheets stabilize the potentiometric interface</text><g filter="url(#s)"><rect x="110" y="185" width="290" height="290" rx="25" fill="#fff" stroke="#d6d0fa" stroke-width="2"/><text x="255" y="226" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#4c3a9c">ION-SELECTIVE MEMBRANE</text><rect x="145" y="250" width="220" height="38" rx="10" fill="#bc9fff"/><text x="255" y="276" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#312369">K⁺ selective ionophore</text><rect x="145" y="302" width="220" height="58" rx="10" fill="#35445d"/><path d="M160 345 C178 315 197 366 218 324 S258 365 280 320 S321 365 348 327" fill="none" stroke="#aee8f3" stroke-width="4"/><text x="255" y="382" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#176a7a">C-coated δ-MnO₂ nanosheets</text><rect x="145" y="399" width="220" height="34" rx="8" fill="#c7864d"/><text x="255" y="422" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff">screen-printed electrode</text></g><path d="M467 235 V426" stroke="#6f62b8" stroke-width="5" stroke-dasharray="8 9"/><circle cx="467" cy="236" r="9" fill="#6f62b8"/><circle cx="467" cy="426" r="9" fill="#6f62b8"/><g filter="url(#s)"><rect x="550" y="184" width="290" height="142" rx="24" fill="#fff" stroke="#d6d0fa" stroke-width="2"/><text x="695" y="229" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#4c3a9c">High capacitance</text><text x="695" y="261" text-anchor="middle" font-family="Arial" font-size="17" fill="#6c6790">stable potential &amp; reduced drift</text><path d="M592 291 C630 254 655 297 689 275 S748 245 796 288" fill="none" stroke="#826fe5" stroke-width="5"/></g><g filter="url(#s)"><rect x="550" y="360" width="290" height="142" rx="24" fill="#fff" stroke="#d6d0fa" stroke-width="2"/><text x="695" y="404" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#4c3a9c">Self-testing</text><text x="695" y="436" text-anchor="middle" font-family="Arial" font-size="17" fill="#6c6790">reliable K⁺ measurement at home</text><path d="M595 467 H795" stroke="#a48df4" stroke-width="3"/><circle cx="624" cy="467" r="10" fill="#5fba9e"/><circle cx="695" cy="467" r="10" fill="#5fba9e"/><circle cx="766" cy="467" r="10" fill="#5fba9e"/></g><text x="60" y="555" font-family="Arial" font-size="16" fill="#6c6790">Layered electrode architecture couples ion-selective recognition with a high-capacitance solid contact.</text></svg>